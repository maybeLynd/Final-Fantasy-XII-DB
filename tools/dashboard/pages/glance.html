<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF12 at a glance</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7873;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --neutral: #c9c7c1;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --link: #1c5cab; --chip: #e7e5df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8d85;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --neutral: #4a4945;
    --link: #86b6ef; --chip: #2c2c29;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8d85;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --neutral: #4a4945;
  --link: #86b6ef; --chip: #2c2c29;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 14px 16px 6px; max-width: 1400px; margin: 0 auto; }
header h1 { font-size: 19px; margin: 0; }
header .meta { color: var(--text-2); font-size: 12.5px; }
header .spacer { flex: 1; }
main { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; }
.grid { display: grid; gap: 14px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); }
.lanes { grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
h2 { font-size: 15px; margin: 22px 0 8px; }
h3 { font-size: 13.5px; margin: 0 0 8px; color: var(--text-2); font-weight: 600; }
.big { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--text-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); margin: 6px 0 2px; }
.bar > i { display: block; height: 100%; }
.lane-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lane-head .name { font-weight: 650; font-size: 15px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; font-size: 12.5px; margin-top: 8px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--critical); } .flat { color: var(--muted); }
.OK, .MET, .ACCEPT { color: var(--good); } .NOT_MET, .REJECT { color: var(--critical); }
.PARTIAL, .ACCEPT-WITH-NARROWING, .pending { color: var(--s4); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); margin-top: 4px; }
.scroll { max-height: 420px; overflow: auto; }
svg { display: block; width: 100%; height: auto; }
.err { color: var(--critical); }
</style>
</head>
<body>
<header>
  <h1>FF12 database at a glance</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="spacer"></span>
  <span class="meta" id="verdict"></span>
</header>
<main id="main"><p class="sub">Loading the latest generation…</p></main>
<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (n, d) => d ? 100 * n / d : null;
const fmt = (x, k = 1) => x == null ? "—" : x.toFixed(k);
function delta(m) {
  const p = m.delta && m.delta.pp;
  if (p == null) return "";
  const cls = p > 0 ? "up" : p < 0 ? "down" : "flat";
  return ` <span class="${cls}">${p > 0 ? "+" : ""}${p.toFixed(2)} pp</span>`;
}
function bar(parts) {
  return `<div class="bar">${parts.map(([w, c, t]) => `<i style="width:${Math.max(0, w)}%;background:${c}" title="${esc(t)}"></i>`).join("")}</div>`;
}
function tile(m, label) {
  const p = m.denominator ? pct(m.numerator, m.denominator) : m.numerator;
  const value = m.id === "overall" ? m.numerator.toFixed(2) + "%" : fmt(p, 1) + "%";
  return `<div class="card"><h3>${esc(label || m.label)}</h3><div class="big">${value}</div>
    <div class="sub">${m.id === "overall" ? "weighted score" : (m.numerator.toLocaleString() + " of " + (m.denominator || 0).toLocaleString())}${delta(m)}</div>
    ${bar([[p || 0, "var(--s1)", value]])}</div>`;
}
function trend(series) {
  const pts = series.filter(s => s[0]);
  if (pts.length < 2) return `<p class="sub">Not enough history yet.</p>`;
  const W = 900, H = 220, L = 40, R = 40, T = 12, B = 26;
  const t0 = Date.parse(pts[0][0]), t1 = Date.parse(pts[pts.length - 1][0]) || t0 + 1;
  const x = t => L + (W - L - R) * (Date.parse(t) - t0) / Math.max(1, t1 - t0);
  const ys = pts.flatMap(p => [p[1], p[2]]).filter(v => v != null);
  const lo = Math.floor(Math.min(...ys) - 1), hi = Math.ceil(Math.max(...ys) + 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / Math.max(1, hi - lo));
  const qs = pts.map(p => p[3]).filter(v => v != null), qhi = Math.max(1, ...qs);
  const yq = v => T + (H - T - B) * (1 - v / qhi);
  const line = (k, fy) => pts.filter(p => p[k] != null).map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + fy(p[k]).toFixed(1)).join(" ");
  const ticks = [lo, (lo + hi) / 2, hi].map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(0)}%</text>
    <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/>`).join("");
  const d0 = new Date(t0).toLocaleDateString(), d1 = new Date(t1).toLocaleString();
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="progress over time">${ticks}
    <text x="${W - R + 6}" y="${yq(qhi) + 4}" font-size="11" fill="var(--s2)">${qhi}</text>
    <text x="${W - R + 6}" y="${yq(0) + 4}" font-size="11" fill="var(--s2)">0</text>
    <path d="${line(3, yq)}" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${line(2, y)}" fill="none" stroke="var(--s3)" stroke-width="2"/>
    <path d="${line(1, y)}" fill="none" stroke="var(--s1)" stroke-width="2.2"/>
    <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${esc(d0)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(d1)}</text></svg>
    <div class="legend"><span><span class="dot" style="background:var(--s1)"></span> My Progress (union %)</span>
    <span><span class="dot" style="background:var(--s3)"></span> progress.py OVERALL %</span>
    <span><span class="dot" style="background:var(--s2)"></span> open register questions (right axis)</span>
    <span>${pts.length} generations</span></div>`;
}
function ago(ts) {
  const h = (Date.now() - Date.parse(ts)) / 3.6e6;
  return isNaN(h) ? "" : h < 1 ? Math.round(h * 60) + " min ago" : h < 48 ? h.toFixed(1) + " h ago" : Math.round(h / 24) + " d ago";
}
function provenance(P, meta) {
  if (!P) return "";
  const drift = Object.entries(meta.drift || {});
  const k = P.knowledge || {}, pr = P.progress || {};
  return `<details class="card" style="margin-top:14px"><summary><b>Source / freshness</b> - generation ${esc(meta.generation || "?")}${drift.length ? ` <span class="err">STALE: ${drift.length} source(s) moved</span>` : ""}</summary>
    <div class="kv" style="margin-top:8px"><dt>generation</dt><dd class="mono">${esc(meta.generation || "?")} (committed ${esc(meta.committed_at || "?")})</dd>
    <dt>generated at</dt><dd>${esc(P.generated_at)}</dd><dt>source commit</dt><dd class="mono">${esc(P.source_commit || "?")}</dd>
    <dt>board</dt><dd>revision ${esc(String(P.board_revision ?? "?"))}, epoch ${esc(String(P.board_epoch ?? "?"))}</dd>
    <dt>progress reporter</dt><dd>${esc(pr.state || "?")} fp ${esc(pr.fingerprint || "?")} commit ${esc(pr.commit || "?")}</dd>
    <dt>knowledge.sqlite</dt><dd>${esc(k.state || "?")}${(k.stale || []).length ? ": " + esc(k.stale.join("; ")) : ""}</dd>
    <dt>goal gate</dt><dd>${esc(P.goal_gate)}</dd><dt>lifecycle file</dt><dd class="mono">${esc(P.lifecycle || "absent")}</dd>
    <dt>stale sources</dt><dd>${drift.length ? esc(drift.map(([n, s]) => n + " " + s).join(", ")) : "none - every input matches this generation"}</dd></div></details>`;
}
function lifecycle(L) {
  if (!L) return "";
  if (L.status !== "OK") return `<h2>Project lifecycle</h2><div class="card"><p class="err">FAILED: ${esc(L.why || "")}</p></div>`;
  const step = p => `<span class="pill" style="${p[3] === "current" ? "background:var(--s1);color:#fff" : p[3] === "done" ? "" : "opacity:.6"}" title="${esc(p[2])}">${esc(p[1])}</span>`;
  return `<h2>Project lifecycle <span class="pill">phase: ${esc(L.phase_label)}</span></h2><div class="card">
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${L.phases.map(step).join(" &rarr; ")}</div>
    <div class="kv" style="margin-top:8px"><dt>phase set by</dt><dd>${esc(L.phase_set_by || "")}</dd>
    <dt>DB_GOAL / requirements ready</dt><dd>${esc(L.db_goal_verdict || "")} / ${L.requirements_ready ? "ready" : "not ready"} (shown beside the phase, never folded into it)</dd>
    <dt>transition</dt><dd>${esc((L.transition_chain || []).join(" -> "))}${L.user_authorization_required ? " (user authorization required; no automatic transition)" : ""}</dd>
    <dt>original game</dt><dd>${esc(L.original_game.role)}</dd>
    <dt>validation</dt><dd>${esc((L.validation_chain || []).join(" -> "))}; on disagreement: ${esc(L.on_disagreement || "")}</dd>
    <dt>${esc(L.probe_label || "PROBE (database phase)")}</dt><dd>${esc(L.probes || "")}</dd>
    ${L.disagreement ? `<dt>declared phase</dt><dd class="err">${esc(L.declared_phase)} (not shown as current: DB_GOAL is ${esc(L.db_goal_verdict || "")})</dd>` : ""}
    ${L.modding_first_class ? "<dt>modding</dt><dd>deep original-game modding stays a first-class output throughout</dd>" : ""}</div>
    ${(L.notes || []).map(n => `<p class="sub"><b>note:</b> ${esc(n)}</p>`).join("")}
    <p class="sub">source: ${esc(L.source)}</p></div>`;
}
function recentChanges(R) {
  if (!R) return "";
  if (R.status === "UNMEASURED") return `<h2>Recent meaningful changes</h2><div class="card"><p class="sub">UNMEASURED: ${esc(R.why || "")}</p></div>`;
  const w = Object.entries(R.windows || {});
  return `<h2>Recent meaningful changes <span class="pill">knowledge vs activity</span></h2><div class="grid two"><div class="card"><h3>By window</h3>
    <table><tr><th>window</th><th>knowledge</th><th>activity</th><th>unclassified</th></tr>${w.map(([k, x]) => `<tr><td>${esc(k)}</td><td><b>${x.knowledge}</b></td><td>${x.activity}</td><td>${x.unclassified}</td></tr>`).join("")}</table>
    ${w.map(([k, x]) => `<details><summary class="sub">${esc(k)} by class</summary><ul class="sub">${x.by_class.map(([c, n]) => `<li>${esc(c)}: ${n}</li>`).join("")}</ul></details>`).join("")}
    ${(R.unknown_classes || []).length ? `<p class="err">unknown class string(s): ${esc(R.unknown_classes.join(", "))}</p>` : ""}</div>
    <div class="card scroll"><h3>What the project learned or proved</h3><table><tr><th>when</th><th>class</th><th>what</th><th>evidence</th></tr>
    ${(R.knowledge_events || []).map(e => `<tr><td class="sub">${esc(ago(e[0]))}</td><td>${esc(e[1])}</td><td>${esc(e[2] || "")}</td><td class="mono">${esc((e[4] || "") + " " + (e[5] || ""))}</td></tr>`).join("") || `<tr><td colspan="4" class="sub">no knowledge events in the window</td></tr>`}</table></div></div>
    <p class="sub">${esc(R.rule)} - ${esc(R.source)}</p>`;
}
function nextWork(N) {
  if (!N) return "";
  const row = i => `<tr><td>${esc(i[2] || "")}</td><td>${esc(i[1])}</td><td class="mono">${esc(i[0])}</td><td>${esc(i[3])}</td><td>${esc(i[4])}${(i[5] || []).length ? ` <span class="pill">serves ${esc(i[5].join(", "))}</span>` : ""}</td></tr>`;
  return `<h2>Next highest-value work</h2><div class="card"><div class="sub">DB_GOAL ${esc(N.gate.verdict || "")}: ${esc(N.gate.remaining || "")} - next: ${esc(N.gate.next || "")}</div>
    ${(N.unowned_blockers || []).length ? `<p class="err">open register row(s) no board task names: ${esc(N.unowned_blockers.join(", "))}</p>` : ""}
    ${N.buckets.map(([b, items, n]) => `<details${b === "BLOCKS DB_GOAL NOW" ? " open" : ""}><summary><b>${esc(b)}</b> <span class="pill">${n}</span></summary>
      ${items.length ? `<table><tr><th>prio</th><th>state</th><th>task</th><th>owner</th><th>target</th></tr>${items.map(row).join("")}</table>` : `<p class="sub">none on the board</p>`}</details>`).join("")}
    <p class="sub">${esc(N.rule)}</p></div>`;
}
function render(r) {
  const v = r.view, g = v.glance, M = Object.fromEntries(v.measures.map(m => [m.id, m]));
  document.getElementById("meta").textContent = "generation " + (r.meta && r.meta.generation || "?") + " · as of " + ((v.source || {}).as_of || "");
  document.getElementById("verdict").innerHTML = `DB_GOAL <b class="${esc(g.verdict)}">${esc(g.verdict)}</b>`;
  let h = "";
  // headline
  h += `<h2>Headline</h2><div class="grid tiles">`;
  if (M.union) h += tile(M.union, "My Progress (L1 + L2)");
  if (M.L1) h += tile(M.L1, "L1 (modding grade)");
  if (M["L2-specific"]) h += tile(M["L2-specific"], "L2-specific (scoped) requirements");
  if (M["L2-cumulative"]) h += tile(M["L2-cumulative"], "Cumulative L2 (gated by L1): " + (M["L2-cumulative"].label.includes("NOT COMPLETE") ? "NOT COMPLETE" : "COMPLETE"));
  if (M.overall) h += tile(M.overall, "Depth OVERALL - weighted diagnostic, not DB_GOAL");
  if (M["register-closed"]) h += tile(M["register-closed"], "Register rows closed");
  if (M.terminal) h += `<div class="card"><h3>Final audit passes</h3><div class="big">${M.terminal.numerator} / ${M.terminal.denominator}</div>
    <div class="sub">starts only when every precondition holds</div>${bar([[pct(M.terminal.numerator, M.terminal.denominator), "var(--s3)", ""]])}</div>`;
  h += `</div>`;
  // the project lifecycle: the phase is read from PROJECT-LIFECYCLE.json by the build; this page only draws it
  h += lifecycle(g.lifecycle);
  // what stands between here and done
  const fam = g.families_unmet || {};
  h += `<div class="grid two" style="margin-top:14px"><div class="card"><h3>What the goal gate still needs</h3>
    <div class="kv"><dt>open / partial rows</dt><dd>${g.open} / ${g.partial}</dd>
    ${Object.entries(fam).map(([k, n]) => `<dt>family ${esc(k)} unmet</dt><dd>${n.toLocaleString()}</dd>`).join("")}
    <dt>remaining</dt><dd>${esc(String(g.remaining ?? ""))}</dd>
    <dt>next</dt><dd>${esc(g.next || "")}</dd></div>
    <div class="sub">copied from goal_gate.py's own lines; scoped L2 verdicts, Depth, parity pilots and board load do not set DB_GOAL</div>
    <details style="margin-top:8px"><summary class="sub">gate detail</summary><ul class="sub">${(g.detail || []).map(d => `<li>${esc(d)}</li>`).join("")}</ul></details></div>
    <div class="card"><h3>Progress over time</h3>${trend(g.series || [])}</div></div>`;
  h += recentChanges(g.recent_changes);
  h += nextWork(g.next_work);
  // priority ladder
  h += `<h2>Priority ladder <span class="pill">${g.ladder.length} active or ready</span></h2><div class="card scroll"><table>
    <tr><th>prio</th><th>state</th><th>task</th><th>who</th><th>target</th></tr>
    ${g.ladder.map(l => `<tr><td>${esc(l[2])}</td><td>${esc(l[1])}</td><td class="mono">${esc(l[0])}</td><td>${esc(l[3])}</td><td>${esc(l[4])}</td></tr>`).join("")}</table></div>`;
  // lanes
  const lanes = Object.entries(g.lanes).sort((a, b) => (b[1].commits24 + b[1].active.length * 3) - (a[1].commits24 + a[1].active.length * 3));
  const maxC = Math.max(1, ...lanes.map(l => l[1].commits24));
  h += `<h2>Lanes <span class="pill">last 24 h</span></h2><div class="grid lanes">`;
  for (const [name, l] of lanes) {
    const lc = l.last_commit;
    h += `<div class="card"><div class="lane-head"><span class="name">${esc(name)}</span>
      <span class="pill"><span class="dot" style="background:${l.active.length ? "var(--good)" : "var(--neutral)"}"></span>${l.active.length ? l.active.length + " active" : "idle"}</span></div>
      ${bar([[100 * l.commits24 / maxC, "var(--s1)", l.commits24 + " commits"]])}
      <dl class="kv"><dt>commits 24 h</dt><dd>${l.commits24}</dd><dt>tasks done 24 h</dt><dd>${l.done24}</dd><dt>ready for it</dt><dd>${l.ready}</dd>
      ${l.active.map(a => `<dt>${esc(a[2] || "")} claim</dt><dd class="mono">${esc(a[0])}</dd>`).join("")}
      ${lc ? `<dt>last commit</dt><dd>${esc(lc[2])} <span class="sub">${esc(ago(lc[1]))}</span></dd>` : ""}</dl></div>`;
  }
  h += `</div>`;
  // register + audits
  const secs = g.sections.filter(s => (s[1].OPEN || 0) + (s[1].PARTIAL || 0) > 0);
  h += `<div class="grid two" style="margin-top:6px"><div><h2>Question register</h2><div class="card">
    <h3>Sections with open or partial rows</h3><table><tr><th>section</th><th class="n">open</th><th class="n">partial</th><th class="n">closed</th><th style="width:40%"></th></tr>
    ${secs.map(([k, c]) => { const tot = Object.values(c).reduce((a, b) => a + b, 0), o = c.OPEN || 0, p = c.PARTIAL || 0;
      return `<tr><td>${esc(k)}</td><td class="n">${o}</td><td class="n">${p}</td><td class="n">${tot - o - p}</td>
      <td>${bar([[100 * (tot - o - p) / tot, "var(--s3)", "closed"], [100 * p / tot, "var(--s4)", "partial"], [100 * o / tot, "var(--critical)", "open"]])}</td></tr>`; }).join("") || "<tr><td colspan=5>none</td></tr>"}
    </table><details style="margin-top:8px"><summary class="sub">${g.open_rows.length} open or partial rows</summary><table>
    ${g.open_rows.map(o => `<tr><td class="mono">${esc(o[0])}</td><td class="${esc(o[1])}">${esc(o[1])}</td><td>${esc(o[2])}</td></tr>`).join("")}</table></details></div></div>
    <div><h2>Audit exchange</h2><div class="card"><h3>Review verdicts on the board</h3>
    <div class="legend">${Object.entries(g.verdicts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="${esc(k)}"><b>${n}</b> ${esc(k)}</span>`).join("")}</div>
    <div class="scroll" style="max-height:300px;margin-top:8px"><table><tr><th>review</th><th>state</th><th>verdict</th><th>reviewer</th><th>updated</th></tr>
    ${g.audits.map(a => `<tr><td class="mono">${esc(a[0])}</td><td>${esc(a[1])}</td><td class="${esc(a[2])}">${esc(a[2])}</td><td>${esc(a[3])}</td><td class="sub">${esc(ago(a[4]))}</td></tr>`).join("")}</table></div></div></div></div>`;
  // commits
  h += `<h2>Recent commits</h2><div class="card scroll"><table><tr><th>commit</th><th>when</th><th>subject</th></tr>
    ${g.commits.map(c => `<tr><td class="mono">${esc(c[0])}</td><td class="sub" style="white-space:nowrap">${esc(ago(c[1]))}</td><td>${esc(c[2])}</td></tr>`).join("")}</table></div>`;
  h += provenance(g.provenance, r.meta || {});
  h += `<p class="sub">Every number is built by code from this generation's captured inputs (${esc((v.source || {}).identity || "")}). ${esc((v.source || {}).limits || "")}</p>`;
  document.getElementById("main").innerHTML = h;
}
async function load() {
  try {
    const r = await (await fetch("/api/view/glance", {cache: "no-store"})).json();
    if (!r.view) { document.getElementById("main").innerHTML = `<p class="err">${esc(r.status)}: ${esc(r.why || (r.problems || []).join("; ") || r.error || "")}</p>`; return; }
    render(r);
  } catch (e) { document.getElementById("main").innerHTML = `<p class="err">dashboard unreachable: ${esc(e)}</p>`; }
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
